<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="720" viewBox="0 0 1450 720"><rect width="1450" height="720" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#183d5c}.h{font-size:34px;font-weight:bold}.sub{font-size:19px;fill:#506779}.box{fill:#eaf4fc;stroke:#78a8ca;stroke-width:2}.green{fill:#e8f7ef;stroke:#63a983;stroke-width:2}.orange{fill:#fff0df;stroke:#d89b57;stroke-width:2}.t{font-size:21px;font-weight:bold}.small{font-size:17px}.arrow{stroke:#386c91;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#386c91"/></marker></defs><text x="50" y="58" class="h">VarPep | RNA-first workflow</text><text x="50" y="92" class="sub">Complete evidence catalogs are independent of optional peptide selection</text><rect x="55" y="130" width="340" height="100" rx="16" class="box"/><text x="225" y="167" text-anchor="middle" class="t">RNA-seq BAM</text><text x="225" y="197" text-anchor="middle" class="small">Read / fragment evidence</text><rect x="535" y="130" width="360" height="100" rx="16" class="box"/><text x="715" y="167" text-anchor="middle" class="t">Local haplotypes</text><text x="715" y="197" text-anchor="middle" class="small">Fragment-supported phase</text><rect x="1035" y="130" width="355" height="100" rx="16" class="box"/><text x="1212" y="167" text-anchor="middle" class="t">Annotation</text><text x="1212" y="197" text-anchor="middle" class="small">REDIportal + dbSNP151</text><path d="M395 180 H535" class="arrow"/><path d="M895 180 H1035" class="arrow"/><path d="M1212 230 V270" class="arrow"/><rect x="860" y="275" width="530" height="140" rx="18" class="green"/><text x="1125" y="318" text-anchor="middle" class="t">COMPLETE CATALOGS</text><text x="1125" y="350" text-anchor="middle" class="small">variants.tsv + haplotypes.tsv</text><text x="1125" y="380" text-anchor="middle" class="small">Unchanged by downstream-only flags</text><path d="M715 230 V300 H650" class="arrow"/><rect x="55" y="305" width="585" height="115" rx="18" class="orange"/><text x="347" y="347" text-anchor="middle" class="t">Optional peptide-only selection</text><text x="347" y="381" text-anchor="middle" class="small">--exclude-known   /   --nonsynonymous-only</text><path d="M347 420 V465" class="arrow"/><rect x="55" y="470" width="585" height="90" rx="16" class="box"/><text x="347" y="505" text-anchor="middle" class="t">Altered protein translation</text><text x="347" y="532" text-anchor="middle" class="small">MHC-I and MHC-II peptide windows</text><path d="M347 560 V603" class="arrow"/><rect x="55" y="608" width="585" height="75" rx="16" class="box"/><text x="347" y="639" text-anchor="middle" class="t">Pepsickle processing predictions</text><text x="347" y="665" text-anchor="middle" class="small">Retained MHC-I candidate contexts</text><text x="880" y="500" class="small">SNP151 matching: position-based</text><text x="880" y="533" class="small">REDIportal: strand-compatible substitutions</text><text x="880" y="566" class="small">No HLA-binding or presentation validation</text></svg>